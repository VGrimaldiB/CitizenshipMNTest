<style>
:root{
--bg:#f5f7fb;
--card:#ffffff;
--text:#1d1d1d;
--accent:#1e5eff;
--yellow:#fff59d;
--yellow-border:#fbc02d;
--green:#18a558;
--red:#dc3545;
}

@media(prefers-color-scheme:dark){
:root{
--bg:#111827;
--card:#1f2937;
--text:#f3f4f6;
--accent:#60a5fa;
--yellow:#facc15;
--yellow-border:#fde047;
}
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
background:var(--bg);
color:var(--text);
padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
}

.container{
max-width:700px;
margin:auto;
}

h1{
text-align:center;
font-size:1.6rem;
margin:12px 0 8px;
}

.progressWrap{
background:#d7dce7;
height:14px;
border-radius:99px;
overflow:hidden;
margin-bottom:8px;
}

.progressBar{
height:100%;
width:0%;
background:var(--accent);
transition:.3s;
}

.stats{
text-align:center;
font-size:.9rem;
margin-bottom:10px;
}

.section{
font-size:1.35rem;
font-weight:800;
text-align:center;
margin-top:10px;
color:var(--accent);
}

.subsection{
font-size:1rem;
font-weight:700;
text-align:center;
background:var(--accent);
color:white;
padding:8px;
border-radius:10px;
margin:10px 0;
}

.card{
background:var(--card);
border-radius:20px;
padding:20px;
box-shadow:0 4px 15px rgba(0,0,0,.15);
min-height:280px;
}

.qnum{
font-size:.9rem;
opacity:.8;
text-align:center;
margin-bottom:15px;
}

.question{
font-size:1.4rem;
font-weight:700;
line-height:1.4;
text-align:center;
}

.answer{
display:none;
margin-top:20px;
background:var(--yellow);
border:3px solid var(--yellow-border);
border-radius:18px;
padding:20px;
font-size:1.35rem;
font-weight:800;
color:#000;
white-space: pre-line;
}

.reveal{
margin-top:20px;
text-align:center;
font-weight:700;
color:var(--accent);
}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:15px;
}

button{
border:none;
border-radius:12px;
padding:14px;
font-size:1rem;
font-weight:700;
cursor:pointer;
}

.primary{
background:var(--accent);
color:white;
}

.good{
background:var(--green);
color:white;
}

.warn{
background:#ff9800;
color:white;
}

.danger{
background:var(--red);
color:white;
}

.secondary{
background:#e5e7eb;
}

.hidden{
display:none;
}

textarea{
width:100%;
height:120px;
margin-top:8px;
}

input[type=file]{
display:none;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.modalBox{
background:white;
max-width:400px;
width:100%;
padding:20px;
border-radius:15px;
color:black;
}

.footer{
margin-top:15px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}
</style>
</head>

<div class="container">

<h1>Minnesota Citizenship Test Study</h1>

<div class="progressWrap">
<div class="progressBar" id="progressBar"></div>
</div>

<div class="stats" id="stats"></div>

<div class="section" id="sectionTitle"></div>

<div class="card" id="card">

<div class="reveal" id="tapLabel">

<div class="answer" id="answer"></div>

<div class="controls">

<button class="primary" onclick="previousCard()">

</button>

<button class="primary" onclick="nextCard()">

</button>

<button class="primary" id="shuffleBtn" onclick="toggleShuffle()">

</button>

<button class="danger" onclick="confirmRestart()">
Restart
</button>

</div>

<div class="footer">

<button class="secondary" onclick="editCard()">

</button>

<button class="secondary" onclick="exportData()">
Export
</button>

<button class="secondary" onclick="document.getElementById('importInput').click()">
Import
</button>

<button class="secondary" onclick="startReviewDeck()">
Review Deck
</button>

</div>

<input id="importInput"

</div>

<div class="modal" id="modal">
<div class="modalBox">

<h3>Edit Card</h3>

<label>Question</label>
<textarea id="editQuestion"></textarea>

<label>Answer(s)</label>
<textarea id="editAnswer"></textarea>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;">

<button class="primary" onclick="saveEdit()">
Save
</button>

<button class="secondary" onclick="closeModal()">
Cancel
</button>

</div>

</div>
</div>

<div class="modal" id="restartModal">
<div class="modalBox">

<p>

Review Deck will be preserved.
</p>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">

<button class="secondary"

Cancel
</button>

<button class="danger"
onclick="restartSession()">
Restart
</button>

</div>

</div>
</div>

let deck=[...cards];
let current=0;
let revealed=false;
let knownCount=0;
let reviewDeck=JSON.parse(localStorage.getItem("reviewDeck")||"[]");
let shuffleMode=false;
let pendingShuffle=false;
let reviewMode=false;
let reviewComplete=false;
let mainDeckPosition=0;
let viewedQuestions=JSON.parse(localStorage.getItem("viewedQuestions")||"[]");
let mainDeckCurrentId = null;

const card=document.getElementById("card");
const qnum=document.getElementById("qnum");
const question=document.getElementById("question");
const answer=document.getElementById("answer");
const bar=document.getElementById("progressBar");
const stats=document.getElementById("stats");
const sectionTitle=document.getElementById("sectionTitle");
const subTitle=document.getElementById("subTitle");
const tapLabel=document.getElementById("tapLabel");
const shuffleBtn=document.getElementById("shuffleBtn");

function saveState(){
localStorage.setItem("studyCurrent",current);
localStorage.setItem("studyKnown",knownCount);
localStorage.setItem("reviewDeck",JSON.stringify(reviewDeck));
localStorage.setItem("studyShuffle",shuffleMode);
}

function loadState(){
current=parseInt(localStorage.getItem("studyCurrent")||0);
knownCount=parseInt(localStorage.getItem("studyKnown")||0);
shuffleMode=localStorage.getItem("studyShuffle")==="true";
shuffleBtn.textContent=shuffleMode?"Ordered":"Shuffle";

if(shuffleMode){
deck=[...cards];
shuffleArray(deck);
}
}

function updateStats(){

const completed =
Math.min(
cards.length,
knownCount + reviewDeck.length
);

const remaining =
Math.max(
0,
cards.length - completed
);

stats.innerHTML =
`
✅ Known: ${knownCount}
&nbsp;&nbsp; | &nbsp;&nbsp;
📌 Review: ${reviewDeck.length}
&nbsp;&nbsp; | &nbsp;&nbsp;
✅ Completed: ${completed}
&nbsp;&nbsp; | &nbsp;&nbsp;
⏳ Remaining: ${remaining}
`;

}

function render(){

if(current < 0) current = 0;

if(current >= deck.length)
current = deck.length - 1;

const c = deck[current];

sectionTitle.textContent = c.section;
subTitle.textContent = c.sub;

qnum.textContent =
`Question ${c.id} of ${cards.length}`;

question.textContent = c.q;

answer.textContent =
c.a.map(x => "• " + x).join("\n");

answer.style.display="none";
tapLabel.style.display="block";

revealed=false;

const completed =
Math.min(
cards.length,
knownCount + reviewDeck.length
);

const pct =
(completed / cards.length) * 100;

bar.style.width =
Math.min(pct,100) + "%";

updateStats();

saveState();
}

card.addEventListener("click",()=>{

revealed=!revealed;

answer.style.display=
revealed?"block":"none";

tapLabel.style.display=
revealed?"none":"block";

});


function autoMarkKnown(){

const id = deck[current].id;

const cardObj =
cards.find(c=>c.id===id);

if(!cardObj) return;

if(
!cardObj.known &&
!reviewDeck.includes(id)
){

cardObj.known = true;

knownCount++;

saveState();

}

}

function nextCard(){

const currentId = deck[current].id;

if(!viewedQuestions.includes(currentId)){

viewedQuestions.push(currentId);

localStorage.setItem(
"viewedQuestions",
JSON.stringify(viewedQuestions)
);

}

if(reviewComplete){

return;

}

autoMarkKnown();

if(pendingShuffle){

deck=[...cards];

shuffleArray(deck);

current=0;

pendingShuffle=false;

render();

return;

}

const lastCard =
(current === deck.length - 1);

if(current < deck.length - 1){

current++;
render();

}else if(lastCard){

if(reviewMode){

reviewComplete=true;

alert(
"Review Deck Complete!"
);

return;

}

render();

alert(
"Session Complete!\n\n"+
"Known: "+knownCount+
"\nReview Later: "+reviewDeck.length
);

}

}

function previousCard(){

if(current<=0){

current=0;

render();

return;

}

current--;

render();

}

function markKnown(){

const id = deck[current].id;

const cardObj =
cards.find(c=>c.id===id);

let wasKnown = cardObj.known;

if(!cardObj.known){

cardObj.known = true;

knownCount++;

}

const reviewIndex =
reviewDeck.indexOf(id);

if(reviewIndex > -1){

reviewDeck.splice(reviewIndex,1);

}

if(
reviewMode &&
reviewDeck.length===0
){

reviewMode=false;

deck=[...cards]
.sort((a,b)=>a.id-b.id);

let restoreIndex =
deck.findIndex(
c => c.id === mainDeckCurrentId
);

if(restoreIndex === -1){

restoreIndex = 0;

}

current = Math.min(
restoreIndex + 1,
deck.length - 1
);

saveState();

updateStats();

alert(
"Review Deck Complete.\n\nReturning to Main Deck."
);

return;

}

saveState();

updateStats();

if(wasKnown){

alert("Already marked as Known");

}else{

alert("Marked as Known");

}

}

function markReview(){

const id = deck[current].id;

const cardObj =
cards.find(c=>c.id===id);

if(cardObj && cardObj.known){

cardObj.known=false;

if(knownCount>0){

knownCount--;

}

}

if(!reviewDeck.includes(id)){

reviewDeck.push(id);

saveState();

alert("Added to Review Deck");

}else{

alert("Already in Review Deck");

}

updateStats();

}

function toggleShuffle(){

shuffleMode=!shuffleMode;

if(shuffleMode){

pendingShuffle=true;

shuffleBtn.textContent="Ordered";

}else{

deck=[...cards]
.sort((a,b)=>a.id-b.id);

current=0;

shuffleBtn.textContent="Shuffle";

render();

}

saveState();

}

function shuffleArray(arr){

for(let i=arr.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[arr[i],arr[j]]=
[arr[j],arr[i]];

}

}

function confirmRestart(){

document.getElementById(
"restartModal"
).style.display="flex";

}

function closeRestart(){

document.getElementById(
"restartModal"
).style.display="none";

}

function restartSession(){

current=0;

knownCount=0;

reviewDeck=[];

cards.forEach(c=>{
delete c.known;
});

deck = shuffleMode
    ? [...cards]
    : [...cards].sort((a,b)=>a.id-b.id);

if(shuffleMode){
shuffleArray(deck);
}

localStorage.removeItem("studyCurrent");
localStorage.removeItem("studyKnown");
localStorage.removeItem("reviewDeck");
localStorage.removeItem("viewedQuestions");

viewedQuestions = [];

pendingShuffle=false;
reviewMode=false;

reviewComplete=false;

saveState();

closeRestart();

render();

}

let editIndex=0;

function editCard(){

editIndex=current;

document.getElementById(
"editQuestion"
).value=
deck[current].q;

document.getElementById(
"editAnswer"
).value=
deck[current].a.join("\n");

document.getElementById(
"modal"
).style.display="flex";

}

function sanitize(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#39;");

}

function validateCard(card){

if(typeof card !== "object")
return false;

if(typeof card.id !== "number")
return false;

if(typeof card.section !== "string")
return false;

if(typeof card.sub !== "string")
return false;

if(typeof card.q !== "string")
return false;

if(!Array.isArray(card.a))
return false;

if(card.a.some(
answer => typeof answer !== "string"
))
return false;

return true;

}

function saveEdit(){

deck[editIndex].q=
sanitize(
document.getElementById(
"editQuestion"
).value
);

deck[editIndex].a=
document.getElementById(
"editAnswer"
).value
.split("\n")
.filter(Boolean)
.map(sanitize);

localStorage.setItem(
"editedCards",
JSON.stringify(deck)
);

closeModal();

render();

}

function closeModal(){

document.getElementById(
"modal"
).style.display="none";

}

function exportData(){

const data={

cards:deck,
reviewDeck,
knownCount

};

const blob=new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"citizenship-study-export.json";

a.click();

}

function importData(event){

const file=
event.target.files[0];

if(!file) return;

if(file.size > 1024 * 1024){

alert(
"Import file too large."
);

return;

}

const reader=
new FileReader();

reader.onload=function(e){

try{

const rawText =
e.target.result;

if(
typeof rawText !== "string" ||
rawText.trim() === ""
){

throw new Error(
"Empty file"
);

}

const data =
JSON.parse(rawText);

if(
typeof data !== "object" ||
data === null
){

throw new Error(
"Invalid JSON structure"
);

}

/* Existing import logic here */

if(data.cards){

const validCards =
data.cards.filter(
validateCard
);

if(validCards.length===0){

throw new Error(
"No valid cards found"
);

}

deck=validCards.map(card=>({

id:card.id,

section:sanitize(card.section),

sub:sanitize(card.sub),

q:sanitize(card.q),

a:card.a.map(sanitize)

}));

}

if(
Array.isArray(data.reviewDeck)
){

reviewDeck =
data.reviewDeck.filter(
id => typeof id === "number"
);

}

if(
typeof data.knownCount === "number"
){

knownCount =
Math.max(
0,
Math.min(
data.knownCount,
cards.length
)
);

}

saveState();

render();

alert(
"Import Complete"
);

}catch(error){

console.error(error);

alert(
"Import failed.\n\n" +
(error.message ||
"Invalid JSON file.")
);

}

};

reader.readAsText(file);

}

function startReviewDeck(){

reviewComplete=false;

reviewMode=true;

mainDeckPosition=current;

mainDeckCurrentId=deck[current].id;

if(reviewDeck.length===0){

alert(
"No review cards saved."
);

return;

}

deck=cards.filter(
c=>reviewDeck.includes(c.id)
);

current=0;

render();

}

let startX=0;

document.addEventListener(
"touchstart",
e=>{
startX=e.touches[0].clientX;
}
);

document.addEventListener(
"touchend",
e=>{

let diff=
e.changedTouches[0].clientX
-startX;

if(diff<-50)
nextCard();

if(diff>50)
previousCard();

}
);

const edited=
localStorage.getItem(
"editedCards"
);

if(edited){

try{

deck=
JSON.parse(edited);

}catch{}

}

loadState();
render();

</script>
